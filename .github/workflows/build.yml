name: Build LanCollab x86 EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.8 (x86)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_x86.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --collect-all --name LanCollabX86 main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LanCollabX86
          path: dist/LanCollabX86.exe
