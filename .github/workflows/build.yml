name: Build LanCollab x86 EXE (Fixed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10 (x86)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x86"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==24.0
          pip install -r requirements_x86.txt
          pip install pyinstaller==6.3.0

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --collect-all --name LanCollabX86 main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LanCollabX86
          path: dist/LanCollabX86.exe
